# Self-hosted Langfuse v2 (free). Project + API keys are pre-seeded so no manual UI setup is needed.
# Login: waris@example.com / waris-demo-pass   ->  http://localhost:3000
# These credentials are local-demo only; all data in this project is synthetic.
services:
  langfuse-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: waris-local-dev-secret
      SALT: waris-local-dev-salt
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: waris-org
      LANGFUSE_INIT_ORG_NAME: Waris
      LANGFUSE_INIT_PROJECT_ID: waris
      LANGFUSE_INIT_PROJECT_NAME: waris
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-waris-demo
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-waris-demo
      LANGFUSE_INIT_USER_EMAIL: waris@example.com
      LANGFUSE_INIT_USER_NAME: Waris Team
      LANGFUSE_INIT_USER_PASSWORD: waris-demo-pass

volumes:
  langfuse_db:
